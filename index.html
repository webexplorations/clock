<title>Bedside Clock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300;400&display=swap">
<style>
/* Layout: one dark screen, time centered and as large as the phone allows; controls fade away. */
:root {
  --bg: #000000;
  --digits: #3a6df0;      /* night: deep blue */
  --soft: #22397a;        /* secondary text in night mode */
  --chip: #080d1c;
  --chip-line: #17254d;
  --mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-face="day"] {
  --digits: #cfe5ff;      /* very light blue */
  --soft: #6a86a6;
  --chip: #0d141c;
  --chip-line: #253447;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--digits);
  font-family: var(--mono);
  margin: 0;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: default;
}
.stage {
  height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2vh;
  opacity: var(--dim, 1);
  transition: opacity .4s ease;
}
.time {
  display: flex; align-items: flex-start; gap: .04em;
  font-weight: 200;
  font-size: min(30vw, 58vh);
  line-height: .9;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
}
.colon { opacity: .55; transition: opacity .2s; }
.colon.off { opacity: .15; }
.ampm {
  font-size: .16em; font-weight: 400; letter-spacing: .08em;
  color: var(--soft); margin-top: .35em; margin-left: .25em;
}
.date {
  font-size: min(4.2vw, 6vh); font-weight: 300;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--soft);
}
.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  transition: opacity .6s ease;
}
.bar.hide { opacity: 0; pointer-events: none; }
button {
  font: 400 13px/1 var(--mono); letter-spacing: .04em;
  color: var(--digits); background: var(--chip);
  border: 1px solid var(--chip-line); border-radius: 999px;
  padding: 10px 14px; min-height: 40px;
}
button:focus-visible { outline: 2px solid var(--digits); outline-offset: 2px; }
.status {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
  text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--soft);
  padding-inline: 16px; transition: opacity .6s ease;
}
.status.hide { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .stage, .bar, .status, .colon { transition: none; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="time" aria-live="off">
    <span id="hh">10</span><span class="colon" id="colon">:</span><span id="mm">42</span><span class="ampm" id="ampm">PM</span>
  </div>
  <div class="date" id="date">Tuesday · Oct 27</div>
</div>

<div class="status" id="status">Tap the screen to keep it awake</div>

<div class="bar" id="bar">
  <button id="face" type="button">Deep blue</button>
  <button id="dimBtn" type="button">Brightness 100%</button>
  <button id="fmt" type="button">12-hour</button>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let face = store.get("face", "night");
  let use24 = store.get("fmt", "12") === "24";
  const dims = [1, 0.6, 0.35, 0.18];
  let dimIdx = Math.min(+store.get("dim", "0") || 0, dims.length - 1);

  function applySettings() {
    document.documentElement.dataset.face = face;
    $("face").textContent = face === "night" ? "Deep blue" : "Light blue";
    $("fmt").textContent = use24 ? "24-hour" : "12-hour";
    document.documentElement.style.setProperty("--dim", dims[dimIdx]);
    $("dimBtn").textContent = "Brightness " + Math.round(dims[dimIdx] * 100) + "%";
  }

  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function tick() {
    const d = new Date();
    let h = d.getHours();
    if (use24) {
      $("hh").textContent = String(h).padStart(2, "0");
      $("ampm").hidden = true;
    } else {
      $("ampm").textContent = h < 12 ? "AM" : "PM";
      $("ampm").hidden = false;
      h = h % 12 || 12;
      $("hh").textContent = String(h).padStart(2, " ");
    }
    $("mm").textContent = String(d.getMinutes()).padStart(2, "0");
    $("colon").classList.toggle("off", d.getSeconds() % 2 === 1);
    $("date").textContent = days[d.getDay()] + " · " + months[d.getMonth()] + " " + d.getDate();
  }

  // Keep the screen awake
  let lock = null;
  function setStatus(msg) { $("status").textContent = msg; }
  async function requestWake() {
    if (!("wakeLock" in navigator)) { setStatus("This browser can't keep the screen on. Set Auto-Lock to Never."); return; }
    try {
      lock = await navigator.wakeLock.request("screen");
      setStatus("Screen will stay on");
      lock.addEventListener("release", () => { lock = null; setStatus("Tap the screen to keep it awake"); showUI(); });
    } catch (e) {
      setStatus("Couldn't keep the screen on. Is Low Power Mode on?");
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !lock) requestWake();
  });

  // Controls fade after a few seconds
  let hideTimer;
  function showUI() {
    $("bar").classList.remove("hide"); $("status").classList.remove("hide");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { $("bar").classList.add("hide"); $("status").classList.add("hide"); }, 5000);
  }

  document.addEventListener("click", () => { if (!lock) requestWake(); showUI(); });

  $("face").addEventListener("click", e => { face = face === "night" ? "day" : "night"; store.set("face", face); applySettings(); });
  $("fmt").addEventListener("click", e => { use24 = !use24; store.set("fmt", use24 ? "24" : "12"); applySettings(); tick(); });
  $("dimBtn").addEventListener("click", e => { dimIdx = (dimIdx + 1) % dims.length; store.set("dim", String(dimIdx)); applySettings(); });

  applySettings();
  tick();
  setInterval(tick, 1000);
  requestWake();
  showUI();
})();
</script>

</body>
</html>
